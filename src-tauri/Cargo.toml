[workspace]
members = ["crates/lepidy-cli", "crates/lepidy-runner"]

[package]
name = "lepidy-desktop"
version = "0.1.0"
description = "Lepidy desktop shell and local runner"
authors = ["Lepidy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lepidy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "1"

# Password hashing and the vault's own primitives are deliberately expensive.
# Left unoptimised in a debug build they turn every test unlock into seconds of
# wall clock, so these dependencies are optimised even in dev.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
