[workspace]
members = ["crates/lepidy-cli", "crates/lepidy-runner"]

[package]
name = "lepidy-desktop"
version = "0.1.0"
description = "Lepidy desktop shell and local runner"
authors = ["Lepidy"]
edition = "2021"
rust-version = "1.77.2"
# This crate builds two binaries: the shell, and the gate that decides whether
# the shell may be bundled. Cargo has no reason to prefer one, and Tauri
# bundles "the" binary cargo produced — which without this picks the gate and
# ships it as the application.
default-run = "lepidy-desktop"

[lib]
name = "lepidy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Windows Hello, and the ACL check on a local preset file. Both are real
# platform questions with no portable answer; the crate wraps the unsafe calls
# so this one does not have to.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials_UI",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lepidy-runner = { path = "crates/lepidy-runner" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `dynamic-acl` grants one capability at startup: the same window-chrome
# permissions the checked-in capability file grants loopback, given to the
# origin `LEPIDY_ORIGIN` named — which `TrustedOrigin` has already validated.
# It is what lets the trusted origin be configuration rather than a constant
# baked into the binary, and it adds no permission the file does not list.
tauri = { version = "2", features = ["tray-icon", "image-png", "dynamic-acl"] }
# Three plugins, and the reason each is a Rust dependency rather than a granted
# capability is in `capabilities/default.json`: the shell performs these, and
# the page reaches them only through the commands in `ipc.rs`.
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
thiserror = "1"

# Password hashing and the vault's own primitives are deliberately expensive.
# Left unoptimised in a debug build they turn every test unlock into seconds of
# wall clock, so these dependencies are optimised even in dev.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
