[package]
name = "lepidy-desktop"
version = "0.1.0"
description = "Lepidy desktop shell and local runner"
authors = ["Lepidy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lepidy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
