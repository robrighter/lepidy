<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Lepidy</title>
<link rel="icon" href="assets/img/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;650;700&family=Inter:wght@400;500;550;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="center">
  <div class="card-narrow">
    <div style="text-align:center;margin-bottom:22px">
      <img src="assets/img/mark.svg" width="44" height="44" alt="">
      <h1 style="font:700 24px/1.2 var(--font-display);margin-top:12px">Welcome back</h1>
      <p class="small muted">Work, transformed.</p>
    </div>

    <div class="panel"><div class="panel-b" style="padding:22px">
      <button class="btn btn-lg" style="width:100%">
        <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.3-.2-1.9H9v3.5h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/>
          <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.3c-.8.6-1.9.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3z"/>
          <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flexrow gap10 mt18 mb18">
        <hr class="sep" style="flex:1;margin:0"><span class="xs muted">or</span>
        <hr class="sep" style="flex:1;margin:0">
      </div>

      <div class="field"><label class="label">Email</label>
        <input class="input" type="email" value="maya@acme.dev"></div>
      <div class="field"><label class="label">Password</label>
        <input class="input" type="password" value="••••••••••••"></div>
      <button class="btn btn-primary btn-lg" style="width:100%">Sign in</button>

      <div class="flexrow gap10 mt14">
        <button class="btn" style="flex:1"><span data-icon="lock"></span> Use a passkey</button>
        <button class="btn" style="flex:1">Email me a link</button>
      </div>
    </div>
    <div class="panel-f xs muted" style="text-align:center">
      Your Lepidy account is yours. Google is a way in — unlink it and everything still works.
    </div></div>

    <p class="small muted mt18" style="text-align:center">
      New here? <a href="pricing.html">Start free</a> — one person, every feature.</p>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/shell.js"></script>
<script>
UI.mount({ page: "signin" });
document.querySelectorAll("[data-icon]").forEach(n => n.innerHTML = UI.icon(n.dataset.icon));
</script>
</body>
</html>
